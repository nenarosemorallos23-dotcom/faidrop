<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Shipment · Faidrop</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/pages.css"></head>
<body data-page="create-shipment"><div class="shell"><header id="site-header"></header><main class="page-main"><div class="page-container">
  <a class="page-back" href="home.html"><span>‹</span> Back to Home</a><div class="page-heading"><span class="eyebrow">Step 1 of 3</span><h1>Create a shipment</h1><p>Tell us what you’re sending and where it’s going.</p></div><div class="step-indicator" aria-label="Step 1 of 3"><span class="active"></span><span></span><span></span></div>
  <form id="shipment-form" class="card stack" novalidate>
    <h2>Parcel details</h2><div class="two-column-form">
      <div class="form-field span-2"><label for="parcel">Parcel name or description</label><input class="input" id="parcel" name="parcel" placeholder="e.g. Documents, gift box" required><span class="form-error" aria-live="polite"></span></div>
      <div class="form-field"><label for="weight">Weight (kg)</label><input class="input" id="weight" name="weight" type="number" min="0.1" max="30" step="0.1" value="2.5" required><span class="form-error" aria-live="polite"></span></div>
      <div class="form-field"><label for="pickup">Pickup address</label><select class="select" id="pickup" name="pickup" required><option value="">Choose pickup location</option><option>Allen Terminal, Allen</option><option>San Isidro Town Plaza, San Isidro</option><option>Victoria Municipal Hall, Victoria</option><option>Rosario Market, Rosario</option></select><span class="form-error" aria-live="polite"></span></div>
      <div class="form-field span-2"><label for="delivery">Delivery address</label><select class="select" id="delivery" name="delivery" required><option value="">Choose delivery location</option><option>UEP Zone 3, Catarman</option><option>Catarman Town Center, Catarman</option><option>San Isidro Town Plaza, San Isidro</option><option>Victoria Municipal Hall, Victoria</option><option>Rosario Market, Rosario</option><option>Allen Terminal, Allen</option></select><span class="form-error" aria-live="polite"></span></div>
    </div><button class="button" type="submit">Continue to Pricing →</button>
  </form>
</div></main><footer id="site-footer" class="site-footer"></footer></div><script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/shipment.js"></script></body></html>
